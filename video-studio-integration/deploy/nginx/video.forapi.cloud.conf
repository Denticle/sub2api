# ForAPI 视频工作台。放在 /opt/enterprise-new-api/nginx/conf.d/，只新增本域名的 server，
# 不改其他站点。上游容器 video-studio-web 自带 nginx，负责 /api 到后端的转发和 SSE/WebSocket。
server {
  listen 80;
  server_name video.forapi.cloud;
  server_tokens off;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://video.forapi.cloud$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name video.forapi.cloud;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/video.forapi.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/video.forapi.cloud/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:VideoForapiSSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  include /etc/nginx/conf.d/cloudflare-real-ip.inc;

  # 视频/参考素材上传；与上游 web 容器内的 1024m 保持一致
  client_max_body_size 1024m;
  client_header_timeout 15s;
  client_body_timeout 300s;
  keepalive_timeout 65s;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    # 变量形式让 nginx 在容器未启动时也能通过 nginx -t，并在容器重建后重新解析
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $video_studio_upstream video-studio-web:3000;
    proxy_pass http://$video_studio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
  }
}
